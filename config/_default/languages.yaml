# Languages
#   Create a section for each of your site's languages.
#   Documentation: https://docs.hugoblox.com/reference/language/

# Default language
en:
  locale: en-us
  label: English
  weight: 1

ja:
  locale: ja
  label: 日本語
  weight: 2
  # URLs are relative and must NOT start with `/`. The theme renders every menu
  # entry as `.URL | relLangURL`, which turns a root-relative `/people/` into
  # `/ja/jkoba-lab/people/` (prefix before the base path) and rewrites an
  # absolute URL to the Japanese path while also matching the theme's
  # `^http` test, which adds `target="_blank"`. A `./`-style relative URL
  # avoids both and yields `/jkoba-lab/ja/...`.
  #
  # `../publications/` is the one deliberate exception: there is no Japanese
  # Publications page, and `relLangURL` resolves the `..` away, so this emits
  # `/jkoba-lab/publications/` and sends Japanese readers to the English list.
  menus:
    main:
      - name: Home
        url: ./
        weight: 10
      - name: Research Topics
        url: research-topics/
        weight: 35
      - name: People
        url: people/
        weight: 40
      - name: Publications
        url: ../publications/
        weight: 50
      - name: News
        url: ./#news
        weight: 20
      - name: About
        url: about/
        weight: 60
