<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Learning source weights for target-position estimation</title>
  <desc id="desc">Current measurements and the mean of three initial measurements are combined using learned fixed weights or an input-dependent rule. Learning uses noisy references without true target positions. The input-dependent rule reduces mean squared error by 4.05% with occasional large errors, adds less than 0.5% under independent errors or reduced current accuracy, and is slightly worse than fixed weights under temporal correlation.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="360" rx="28" fill="url(#background)"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <rect x="30" y="30" width="410" height="300" rx="20" fill="#fff" stroke="#dbe4ee"/>
    <rect x="460" y="30" width="470" height="300" rx="20" fill="#fff" stroke="#dbe4ee"/>
    <text x="54" y="68" fill="#0f172a" font-size="22" font-weight="700">Combine uncertain measurements</text>
    <text x="54" y="94" fill="#64748b" font-size="14">A fixed target within each simulated trial</text>
    <rect x="54" y="116" width="362" height="58" rx="12" fill="#f1f5f9"/>
    <text x="235" y="140" text-anchor="middle" fill="#475569" font-size="14">Current measurement</text>
    <text x="235" y="160" text-anchor="middle" fill="#475569" font-size="13">+ mean of 3 initial measurements</text>
    <path d="M235 182 V204 M228 194 L235 204 L242 194" fill="none" stroke="#334155" stroke-width="2"/>
    <rect x="54" y="212" width="174" height="54" rx="12" fill="#eff6ff"/>
    <rect x="242" y="212" width="174" height="54" rx="12" fill="#ecfdf5"/>
    <text x="141" y="235" text-anchor="middle" fill="#1d4ed8" font-size="14">Learned fixed</text>
    <text x="141" y="254" text-anchor="middle" fill="#1d4ed8" font-size="14">weights</text>
    <text x="329" y="235" text-anchor="middle" fill="#0f766e" font-size="14">Input-dependent</text>
    <text x="329" y="254" text-anchor="middle" fill="#0f766e" font-size="14">weights</text>
    <text x="54" y="296" fill="#64748b" font-size="13">Learn from noisy references; no true target positions</text>
    <text x="484" y="68" fill="#0f172a" font-size="22" font-weight="700">When do changing weights help?</text>
    <text x="484" y="94" fill="#64748b" font-size="14">Compared with learned fixed weights</text>
    <text x="484" y="134" fill="#334155" font-size="15" font-weight="700">Occasional large measurement errors</text>
    <text x="484" y="158" fill="#0f766e" font-size="19" font-weight="700">4.05% lower mean squared error</text>
    <text x="484" y="198" fill="#334155" font-size="15" font-weight="700">Independent errors / reduced current accuracy</text>
    <text x="484" y="222" fill="#64748b" font-size="15">Less than 0.5% additional improvement</text>
    <text x="484" y="262" fill="#334155" font-size="15" font-weight="700">Temporally correlated errors</text>
    <text x="484" y="286" fill="#64748b" font-size="15">Learned fixed weights have slightly lower error</text>
    <text x="484" y="311" fill="#64748b" font-size="12">Longer observation histories help in several conditions</text>
  </g>
</svg>
