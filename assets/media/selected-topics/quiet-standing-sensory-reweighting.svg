<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Reliability-dependent sensory reweighting in quiet standing</title>
  <desc id="desc">Left: a one-link inverted pendulum standing on its ankle, with visual, vestibular, and body senses feeding one estimate of tilt. Right: when vision is misled, lowering only the visual weight (precision) cuts the posture shift by 82% compared with equal weights.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-12%" width="120%" height="130%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#0f172a" flood-opacity=".13"/>
    </filter>
  </defs>

  <rect width="960" height="360" rx="28" fill="url(#background)"/>
  <rect x="24" y="24" width="912" height="312" rx="22" fill="#ffffff" opacity=".8"/>

  <!-- Left card: the model -->
  <g filter="url(#soft-shadow)">
    <rect x="54" y="62" width="318" height="236" rx="20" fill="#ffffff" stroke="#dbe4ee"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="82" y="95" fill="#0f172a" font-size="22" font-weight="750">quiet standing</text>
    <text x="82" y="119" fill="#64748b" font-size="14">three senses, one estimate of tilt</text>

    <!-- floor and ankle -->
    <rect x="96" y="262" width="200" height="14" rx="7" fill="#e2e8f0"/>
    <!-- upright reference -->
    <path d="M196 262 L196 150" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 6"/>
    <!-- body rod, slightly tilted -->
    <path d="M196 262 L214 160" fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round"/>
    <circle cx="217" cy="147" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
    <circle cx="196" cy="262" r="10" fill="#ffffff" stroke="#334155" stroke-width="4"/>
    <!-- ankle torque arc -->
    <path d="M160 262 A36 36 0 0 1 172 235" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-slate)"/>
    <text x="82" y="292" fill="#64748b" font-size="13">ankle torque holds the body upright</text>

    <!-- sense tags -->
    <g>
      <path d="M233 147 L262 138" fill="none" stroke="#2563eb" stroke-width="2"/>
      <rect x="262" y="126" width="88" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
      <path d="M272 138 C277 131 289 131 294 138 C289 145 277 145 272 138Z" fill="none" stroke="#2563eb" stroke-width="2"/>
      <circle cx="283" cy="138" r="3" fill="#2563eb"/>
      <text x="300" y="143" fill="#1d4ed8" font-size="13" font-weight="700">visual</text>
    </g>
    <g>
      <path d="M232 152 L262 176" fill="none" stroke="#b45309" stroke-width="2"/>
      <rect x="262" y="164" width="100" height="24" rx="12" fill="#fffbeb" stroke="#fde68a"/>
      <path d="M272 181 C270 173 276 168 281 169 C286 170 286 176 282 179" fill="none" stroke="#b45309" stroke-width="2" stroke-linecap="round"/>
      <text x="292" y="181" fill="#92400e" font-size="13" font-weight="700">vestibular</text>
    </g>
    <g>
      <path d="M204 214 L176 226" fill="none" stroke="#0f766e" stroke-width="2"/>
      <rect x="96" y="214" width="80" height="24" rx="12" fill="#ecfdf5" stroke="#99f6e4"/>
      <path d="M106 226 C110 218 118 218 122 226 C126 234 134 234 138 226" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round"/>
      <text x="142" y="231" fill="#0f766e" font-size="13" font-weight="700">body</text>
    </g>
  </g>

  <!-- Right card: the result -->
  <g filter="url(#soft-shadow)">
    <rect x="426" y="62" width="480" height="236" rx="20" fill="#ffffff" stroke="#dbe4ee"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="454" y="95" fill="#0f172a" font-size="22" font-weight="750">weight each sense by its reliability</text>
    <text x="454" y="119" fill="#64748b" font-size="14">vision is misled; only its weight (precision) is lowered</text>

    <path d="M666 140 L666 288" fill="none" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Scenario A: equal weights -->
    <g>
      <text x="454" y="156" fill="#334155" font-size="14" font-weight="750">equal weights</text>

      <text x="454" y="180" fill="#1d4ed8" font-size="12" font-weight="700">visual</text>
      <rect x="520" y="171" width="96" height="10" rx="5" fill="#dbeafe"/>
      <rect x="520" y="171" width="66" height="10" rx="5" fill="#2563eb"/>

      <text x="454" y="204" fill="#0f766e" font-size="12" font-weight="700">body</text>
      <rect x="520" y="195" width="96" height="10" rx="5" fill="#ccfbf1"/>
      <rect x="520" y="195" width="66" height="10" rx="5" fill="#0f766e"/>

      <text x="454" y="228" fill="#92400e" font-size="12" font-weight="700">vestibular</text>
      <rect x="520" y="219" width="96" height="10" rx="5" fill="#fef3c7"/>
      <rect x="520" y="219" width="66" height="10" rx="5" fill="#b45309"/>

      <!-- mini pendulum, leaning toward the misleading scene -->
      <rect x="604" y="248" width="44" height="8" rx="4" fill="#e2e8f0"/>
      <path d="M626 248 L626 190" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 4"/>
      <path d="M626 248 L648 196" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
      <circle cx="649" cy="192" r="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>

      <text x="454" y="266" fill="#b45309" font-size="14" font-weight="750">large posture shift</text>
      <text x="454" y="284" fill="#64748b" font-size="12">the misled vision pulls the body over</text>
    </g>

    <!-- Scenario B: visual weight lowered -->
    <g>
      <text x="690" y="156" fill="#334155" font-size="14" font-weight="750">visual weight lowered</text>

      <text x="690" y="180" fill="#1d4ed8" font-size="12" font-weight="700">visual</text>
      <rect x="756" y="171" width="96" height="10" rx="5" fill="#dbeafe"/>
      <rect x="756" y="171" width="14" height="10" rx="5" fill="#2563eb"/>

      <text x="690" y="204" fill="#0f766e" font-size="12" font-weight="700">body</text>
      <rect x="756" y="195" width="96" height="10" rx="5" fill="#ccfbf1"/>
      <rect x="756" y="195" width="66" height="10" rx="5" fill="#0f766e"/>

      <text x="690" y="228" fill="#92400e" font-size="12" font-weight="700">vestibular</text>
      <rect x="756" y="219" width="96" height="10" rx="5" fill="#fef3c7"/>
      <rect x="756" y="219" width="66" height="10" rx="5" fill="#b45309"/>

      <!-- mini pendulum, nearly upright -->
      <rect x="852" y="248" width="44" height="8" rx="4" fill="#e2e8f0"/>
      <path d="M874 248 L874 190" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 4"/>
      <path d="M874 248 L878 192" fill="none" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
      <circle cx="878" cy="188" r="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>

      <text x="690" y="266" fill="#0f766e" font-size="14" font-weight="750">posture shift down by 82%</text>
      <text x="690" y="284" fill="#64748b" font-size="12">other senses keep their say</text>
    </g>
  </g>
</svg>
